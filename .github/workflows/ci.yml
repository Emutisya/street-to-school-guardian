name: Local baseline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Train synthetic resource retriever
        run: python -m guardian train
      - name: Evaluate held-out relevance
        run: python -m guardian evaluate
      - name: Unit, CLI and loopback HTTP checks
        run: python -m unittest discover -s tests -v
